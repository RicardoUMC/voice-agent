[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-agent"
version = "0.1.0"
description = "Persistent local voice daemon connected to Pi RPC"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
voice-agent = "voice_agent.__main__:main"
voice-agent-client = "voice_agent.client:main"

[tool.setuptools.packages.find]
include = ["voice_agent*"]
